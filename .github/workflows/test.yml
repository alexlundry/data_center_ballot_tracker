name: Pipeline tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ["R/**", "data/races.csv", "data/sources.csv"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr2
            any::jsonlite
            any::rvest
            any::xml2
            any::readxl
            any::glue
            any::cli
            any::testthat
      - run: Rscript -e 'testthat::test_dir("R/tests/testthat")'
      - run: Rscript R/build_races.R
