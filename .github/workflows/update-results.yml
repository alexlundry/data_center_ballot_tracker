# Election-night results refresh.
# GitHub's scheduler runs no more often than every 5 minutes and can lag on busy
# nights. For tighter cadence run `Rscript R/watch.R 120` on a laptop instead,
# which does the same fetch-commit-push loop every two minutes.
name: Update results

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (UTC). Disable this workflow after election week.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr2
            any::jsonlite
            any::rvest
            any::xml2
            any::readxl
            any::glue
            any::cli
            any::pdftools
      - name: Rebuild registry and fetch results
        run: |
          Rscript R/build_races.R
          Rscript R/fetch_results.R
      - name: Commit if anything changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add site/data/results.json site/data/races.json data/history.csv
          if git diff --cached --quiet; then echo "no change"; else
            git commit -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
