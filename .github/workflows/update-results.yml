# Election-night results refresh.
# GitHub's scheduler runs no more often than every 5 minutes and can lag on busy
# nights. For tighter cadence run `Rscript R/watch.R 120` on a laptop instead,
# which does the same fetch-commit-push loop every two minutes.
name: Update results

on:
  schedule:
    # Every 5 minutes (UTC) on Nov 3 and Nov 4 only, which covers election
    # night in every US time zone. Widen or trigger manually for the days
    # after if counties are still updating. GitHub may delay scheduled runs.
    - cron: "*/5 * 3,4 11 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr2
            any::jsonlite
            any::rvest
            any::xml2
            any::readxl
            any::glue
            any::cli
            any::pdftools
            any::googlesheets4
      - name: Rebuild registry and fetch results
        env:
          # Optional: lets the pipeline write live numbers straight into the
          # election-night Google Sheet. See RUNBOOK.md.
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          RESULTS_SHEET_ID: ${{ secrets.RESULTS_SHEET_ID }}
        run: |
          Rscript R/build_races.R
          Rscript R/fetch_results.R
      - name: Commit if the counts changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          # results.json carries a generated_at timestamp that changes every
          # run; only commit when the counts themselves (or the registry or
          # history) changed, so quiet periods produce no commits or deploys.
          counts_changed=1
          if git cat-file -e HEAD:site/data/results.json 2>/dev/null; then
            if diff <(git show HEAD:site/data/results.json | jq -S 'del(.generated_at)') \
                    <(jq -S 'del(.generated_at)' site/data/results.json) >/dev/null; then
              counts_changed=0
            fi
          fi
          # races.json is rebuilt every run too; stage it only if more than
          # its generated_at changed
          if git cat-file -e HEAD:site/data/races.json 2>/dev/null && \
             diff <(git show HEAD:site/data/races.json | jq -S 'del(.generated_at)') \
                  <(jq -S 'del(.generated_at)' site/data/races.json) >/dev/null; then
            git checkout -- site/data/races.json
          else
            git add site/data/races.json
          fi
          git add data/history.csv
          if [ "$counts_changed" = "1" ]; then git add site/data/results.json site/data/results.csv; fi
          if git diff --cached --quiet; then echo "no meaningful change"; else
            git add site/data/results.json site/data/results.csv
            git commit -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
