# Election-night results refresh.
# GitHub's scheduler runs no more often than every 5 minutes and can lag on busy
# nights. For tighter cadence run `Rscript R/watch.R 120` on a laptop instead,
# which does the same fetch-commit-push loop every two minutes.
name: Update results

on:
  schedule:
    # Every 5 minutes (UTC) on Nov 3 and Nov 4 only, which covers election
    # night in every US time zone. Widen or trigger manually for the days
    # after if counties are still updating. GitHub may delay scheduled runs.
    - cron: "*/5 * 3,4 11 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::httr2
            any::jsonlite
            any::rvest
            any::xml2
            any::readxl
            any::glue
            any::cli
            any::pdftools
      - name: Rebuild registry and fetch results
        run: |
          Rscript R/build_races.R
          Rscript R/fetch_results.R
      - name: Commit if the counts changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          # results.json carries a generated_at timestamp that changes every
          # run; only commit when the counts themselves (or the registry or
          # history) changed, so quiet periods produce no commits or deploys.
          counts_changed=1
          if git cat-file -e HEAD:site/data/results.json 2>/dev/null; then
            if diff <(git show HEAD:site/data/results.json | jq -S 'del(.generated_at)') \
                    <(jq -S 'del(.generated_at)' site/data/results.json) >/dev/null; then
              counts_changed=0
            fi
          fi
          git add site/data/races.json data/history.csv
          if [ "$counts_changed" = "1" ]; then git add site/data/results.json; fi
          if git diff --cached --quiet; then echo "no meaningful change"; else
            git add site/data/results.json
            git commit -m "results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
